name: Make archive

on:
    push:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: build
              run: sh ./build.sh

            - name: artifact
              uses: actions/upload-artifact@v7
              with:
                  name: atan-nuclear-science
                  path: build/*.zip
                  archive: false
                  if-no-files-found: error
